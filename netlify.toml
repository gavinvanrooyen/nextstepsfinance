[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules"

[functions."scheduled-post"]
  # Runs once an hour (cron is UTC), not once a day.
  #
  # Why hourly: the job only publishes items whose scheduledAt has already
  # passed. With a once-a-day cron, everything due since the last run fires
  # together in a single batch, regardless of how carefully the approval
  # dashboard spaced out individual scheduledAt times. Running hourly means
  # each post actually goes out close to the time it was scheduled for, so
  # the dashboard's slot-spacing (3 slots/day, 90 min apart) has a real
  # effect instead of being flattened into one daily dump.
  schedule = "0 * * * *"

# Clean URLs for the dashboard's fetch calls: /api/list-content instead of
# /.netlify/functions/list-content
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
