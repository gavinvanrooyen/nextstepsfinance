<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Next Steps Finance — Content Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">NSF</span>
      <span class="brand-name">Content Ops</span>
    </div>

    <div class="section-tabs" role="tablist">
      <button class="section-tab is-active" data-section="plan">Content Plan</button>
      <button class="section-tab" data-section="ideas">Add Ideas</button>
      <button class="section-tab" data-section="review">Posting Review</button>
    </div>

    <div class="tabs" id="plan-tabs" role="tablist">
      <button class="tab is-active" data-planview="list">List</button>
      <button class="tab" data-planview="timeline">Timeline</button>
    </div>

    <div class="tabs" id="review-tabs" role="tablist" hidden>
      <button class="tab is-active" data-filter="pending" role="tab">Needs review</button>
      <button class="tab" data-filter="approved" role="tab">Approved &amp; scheduled</button>
      <button class="tab" data-filter="posted" role="tab">Posted</button>
      <button class="tab" data-filter="rejected" role="tab">Rejected</button>
    </div>
  </div>
</header>

<main class="main">
  <div id="status-banner" class="status-banner" hidden></div>

  <section id="section-plan">
    <div id="plan-summary" class="plan-summary"></div>
    <div id="plan-list" class="plan-list"></div>
    <div id="plan-timeline" class="plan-timeline" hidden></div>
  </section>

  <section id="section-ideas" hidden>
    <p class="ideas-intro">Jot down new video ideas here. Each one gets added to the CMS as an <strong>Idea</strong> — the first stage before Scripted — so it shows up in the Content Plan ready to develop.</p>
    <div id="idea-rows" class="idea-rows"></div>
    <div class="idea-form-actions">
      <button id="add-idea-row" class="btn btn-reset">+ Add another idea</button>
      <button id="submit-ideas" class="btn btn-approve">Submit all ideas</button>
    </div>
  </section>

  <section id="section-review" hidden>
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-title">Nothing here yet</p>
      <p class="empty-sub">Content shows up once a video or short has at least one platform queued for posting.</p>
    </div>
    <div id="card-list" class="card-list"></div>
  </section>
</main>

<script src="/plan.js"></script>
<script src="/ideas.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
