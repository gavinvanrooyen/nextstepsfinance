<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Next Steps Finance — Posting Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">NSF</span>
      <span class="brand-name">Posting Review</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab is-active" data-filter="pending" role="tab">Needs review</button>
      <button class="tab" data-filter="approved" role="tab">Approved &amp; scheduled</button>
      <button class="tab" data-filter="posted" role="tab">Posted</button>
      <button class="tab" data-filter="rejected" role="tab">Rejected</button>
    </div>
  </div>
</header>

<main class="main">
  <div id="status-banner" class="status-banner" hidden></div>
  <div id="empty-state" class="empty-state" hidden>
    <p class="empty-title">Nothing here yet</p>
    <p class="empty-sub">Content shows up once a video or short has at least one platform queued for posting.</p>
  </div>
  <div id="card-list" class="card-list"></div>
</main>

<script src="/dashboard.js"></script>
</body>
</html>
